<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hand-Tracked File Drag Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div>
      Hand-Tracked File Drag Demo
      <div class="status" id="status">Loading MediaPipe…</div>
    </div>
    <button id="startBtn">Start Camera</button>
  </header>

  <section id="desktop">
    <div class="file" data-id="file1" style="left: 60px; top: 60px;">
      <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=400&q=80" alt="File 1" />
      <div class="file-label">proposal_v1.pdf</div>
    </div>

    <div class="file" data-id="file2" style="left: 260px; top: 160px;">
      <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80" alt="File 2" />
      <div class="file-label">design_mock.png</div>
    </div>

    <div class="file" data-id="file3" style="left: 460px; top: 260px;">
      <img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=400&q=80" alt="File 3" />
      <div class="file-label">notes.txt</div>
    </div>

    <canvas id="overlay"></canvas>
  </section>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="debug">
    <div>Gesture: thumb + index pinch over a file to grab, move to drag, release to drop.</div>
    <textarea id="logs" readonly></textarea>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
