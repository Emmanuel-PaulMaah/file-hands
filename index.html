<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand-Tracked File Drag Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 16px;
      background: #111727;
      border-bottom: 1px solid #1f2a3f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    header .status {
      font-size: 12px;
      opacity: 0.8;
    }
    header button {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Full-screen desktop grid */
    #desktop {
      position: relative;
      flex: 1;
      overflow: hidden;
      background-color: #020617;
      background-image:
        linear-gradient(#1f2937 1px, transparent 1px),
        linear-gradient(90deg, #1f2937 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .file {
      position: absolute;
      width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.8);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      background: #020617;
      display: flex;
      flex-direction: column;
      cursor: grab;
      transition: box-shadow 0.1s ease, transform 0.1s ease;
    }
    .file.active {
      box-shadow: 0 0 0 2px #2563eb, 0 10px 25px rgba(37, 99, 235, 0.6);
      cursor: grabbing;
    }
    .file img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex: 1;
    }
    .file-label {
      padding: 4px 6px;
      font-size: 11px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(30, 64, 175, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Overlay for hand skeleton / cursor */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Hidden video used only for MediaPipe input */
    #webcam {
      display: none;
    }

    #debug {
      font-size: 11px;
      padding: 6px 10px;
      background: #020617;
      border-top: 1px solid #1f2937;
    }
    #logs {
      width: 100%;
      height: 100px;
      border: none;
      padding: 4px 6px;
      resize: none;
      background: #020617;
      color: #e5e7eb;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      Hand-Tracked File Drag Demo
      <div class="status" id="status">Loading MediaPipe…</div>
    </div>
    <button id="startBtn">Start Camera</button>
  </header>

  <!-- Full-screen desktop grid -->
  <section id="desktop">
    <div
      class="file"
      data-id="file1"
      style="left: 60px; top: 60px;"
    >
      <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=400&q=80" alt="File 1" />
      <div class="file-label">proposal_v1.pdf</div>
    </div>
    <div
      class="file"
      data-id="file2"
      style="left: 260px; top: 160px;"
    >
      <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80" alt="File 2" />
      <div class="file-label">design_mock.png</div>
    </div>
    <div
      class="file"
      data-id="file3"
      style="left: 460px; top: 260px;"
    >
      <img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=400&q=80" alt="File 3" />
      <div class="file-label">notes.txt</div>
    </div>

    <!-- Hand overlay on top of desktop -->
    <canvas id="overlay"></canvas>
  </section>

  <!-- Hidden video for MediaPipe -->
  <video id="webcam" autoplay playsinline muted></video>

  <div id="debug">
    <div>Gesture: thumb + index pinch over a file to grab, move to drag, release to drop.</div>
    <textarea id="logs" readonly></textarea>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const video = document.getElementById("webcam");
    const desktop = document.getElementById("desktop");
    const overlay = document.getElementById("overlay");
    const logTextarea = document.getElementById("logs");

    const files = Array.from(document.querySelectorAll(".file"));

    const overlayCtx = overlay.getContext("2d");
    const drawingUtils = new DrawingUtils(overlayCtx);

    let handLandmarker = null;
    let running = false;

    // state
    let lastVideoTime = -1;
    let isPinching = false;
    let wasPinching = false;
    let activeFile = null;

    function log(msg) {
      const ts = new Date().toISOString().split("T")[1].split(".")[0];
      logTextarea.value = `[${ts}] ${msg}\n` + logTextarea.value;
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
      log(msg);
    }

    async function initHandLandmarker() {
      setStatus("Loading MediaPipe models…");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task"
        },
        numHands: 1,
        runningMode: "VIDEO"
      });
      setStatus("Models loaded. Click 'Start Camera'.");
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        resizeOverlay();
        window.addEventListener("resize", resizeOverlay);

        running = true;
        setStatus("Camera started. Show your hand in front of the camera.");
        log("Ready – start pinching over a file to drag it.");

        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        setStatus("Error starting camera: " + err.message);
        log("Error: " + err.message);
      }
    }

    function resizeOverlay() {
      const rect = desktop.getBoundingClientRect();
      overlay.width = rect.width;
      overlay.height = rect.height;
    }

    // Map normalized landmark coords -> desktop coordinates (viewport space)
    function screenCoordsFromLandmark(landmark) {
      const rect = desktop.getBoundingClientRect();
      const x = landmark.x * rect.width + rect.left;
      const y = landmark.y * rect.height + rect.top;
      return { x, y };
    }

    function getFileUnderPoint(x, y) {
      for (let i = files.length - 1; i >= 0; i--) {
        const file = files[i];
        const rect = file.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return file;
        }
      }
      return null;
    }

    function updateFilePosition(file, x, y) {
      const desktopRect = desktop.getBoundingClientRect();
      const fileRect = file.getBoundingClientRect();
      const offsetX = fileRect.width / 2;
      const offsetY = fileRect.height / 2;

      let newLeft = x - desktopRect.left - offsetX;
      let newTop = y - desktopRect.top - offsetY;

      newLeft = Math.max(0, Math.min(newLeft, desktopRect.width - fileRect.width));
      newTop = Math.max(0, Math.min(newTop, desktopRect.height - fileRect.height));

      file.style.left = newLeft + "px";
      file.style.top = newTop + "px";
    }

    function detectPinch(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];

      const dx = thumbTip.x - indexTip.x;
      const dy = thumbTip.y - indexTip.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      const PINCH_THRESHOLD = 0.05; // bump to 0.07–0.08 if needed
      return dist < PINCH_THRESHOLD;
    }

    function drawLandmarks(results) {
      overlayCtx.save();
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      if (!results || !results.landmarks || results.landmarks.length === 0) {
        overlayCtx.restore();
        return;
      }

      const h = results.landmarks[0];
      // DrawingUtils expects coords in [0,1] when used with VIDEO tasks.
      drawingUtils.drawConnectors(h, HandLandmarker.HAND_CONNECTIONS);
      drawingUtils.drawLandmarks(h, { radius: 3 });

      overlayCtx.restore();
    }

    async function loop() {
      if (!running || !handLandmarker) return;

      const videoTime = video.currentTime;
      if (videoTime === lastVideoTime) {
        window.requestAnimationFrame(loop);
        return;
      }
      lastVideoTime = videoTime;

      const nowMs = performance.now();
      const results = handLandmarker.detectForVideo(video, nowMs);

      drawLandmarks(results);

      if (results && results.landmarks && results.landmarks.length > 0) {
        const landmarks = results.landmarks[0];

        const pinchNow = detectPinch(landmarks);
        const pinchPosNorm = landmarks[8]; // index fingertip
        const { x, y } = screenCoordsFromLandmark(pinchPosNorm);

        isPinching = pinchNow;

        // pinch start
        if (isPinching && !wasPinching) {
          const file = getFileUnderPoint(x, y);
          if (file) {
            activeFile = file;
            activeFile.classList.add("active");
            log("Pinch start on " + activeFile.dataset.id);
          } else {
            activeFile = null;
          }
        }

        // pinch move
        if (isPinching && activeFile) {
          updateFilePosition(activeFile, x, y);
        }

        // pinch end
        if (!isPinching && wasPinching && activeFile) {
          log("Pinch released – dropped " + activeFile.dataset.id);
          activeFile.classList.remove("active");
          activeFile = null;
        }

        wasPinching = isPinching;
      } else {
        // no hand detected
        isPinching = false;
        if (wasPinching && activeFile) {
          log("Hand lost – dropping " + activeFile.dataset.id);
          activeFile.classList.remove("active");
          activeFile = null;
        }
        wasPinching = false;
      }

      window.requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", () => {
      if (!handLandmarker) {
        setStatus("Still loading models – please wait a moment…");
        return;
      }
      if (!running) {
        startCamera();
      }
    });

    if (!("mediaDevices" in navigator && "getUserMedia" in navigator.mediaDevices)) {
      setStatus("getUserMedia not supported in this browser.");
    } else {
      initHandLandmarker().catch((err) => {
        console.error(err);
        setStatus("Failed to init MediaPipe: " + err.message);
      });
    }
  </script>
</body>
</html>
