<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand-Tracked File Drag Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 16px;
      background: #111727;
      border-bottom: 1px solid #1f2a3f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    header .status { font-size: 12px; opacity: 0.8; }
    header button {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
    }

    #desktop {
      position: relative;
      flex: 1;
      overflow: hidden;
      background-color: #020617;
      background-image:
        linear-gradient(#1f2937 1px, transparent 1px),
        linear-gradient(90deg, #1f2937 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .file {
      position: absolute;
      width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.8);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      background: #020617;
      display: flex;
      flex-direction: column;
      cursor: grab;
      transition: box-shadow 0.1s ease, transform 0.1s ease;
    }
    .file.active {
      box-shadow: 0 0 0 2px #2563eb, 0 10px 25px rgba(37, 99, 235, 0.6);
      cursor: grabbing;
    }
    .file img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex: 1;
    }
    .file-label {
      padding: 4px 6px;
      font-size: 11px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(30, 64, 175, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #webcam { display: none; }

    #debug {
      font-size: 11px;
      padding: 6px 10px;
      background: #020617;
      border-top: 1px solid #1f2937;
    }
    #logs {
      width: 100%;
      height: 100px;
      border: none;
      padding: 4px 6px;
      resize: none;
      background: #020617;
      color: #e5e7eb;
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      Hand-Tracked File Drag Demo
      <div class="status" id="status">Loading MediaPipe…</div>
    </div>
    <button id="startBtn">Start Camera</button>
  </header>

  <section id="desktop">
    <div class="file" data-id="file1" style="left: 60px; top: 60px;">
      <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=400&q=80" alt="File 1" />
      <div class="file-label">proposal_v1.pdf</div>
    </div>
    <div class="file" data-id="file2" style="left: 260px; top: 160px;">
      <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80" alt="File 2" />
      <div class="file-label">design_mock.png</div>
    </div>
    <div class="file" data-id="file3" style="left: 460px; top: 260px;">
      <img src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&w=400&q=80" alt="File 3" />
      <div class="file-label">notes.txt</div>
    </div>

    <canvas id="overlay"></canvas>
  </section>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="debug">
    <div>Gesture: thumb + index pinch over a file to grab, move to drag, release to drop.</div>
    <textarea id="logs" readonly></textarea>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const video = document.getElementById("webcam");
    const desktop = document.getElementById("desktop");
    const overlay = document.getElementById("overlay");
    const logTextarea = document.getElementById("logs");

    const files = Array.from(document.querySelectorAll(".file"));

    const overlayCtx = overlay.getContext("2d");
    const drawingUtils = new DrawingUtils(overlayCtx);

    let handLandmarker = null;
    let running = false;

    let lastVideoTime = -1;
    let isPinching = false;
    let wasPinching = false;
    let activeFile = null;

    // =========================
    // 1) One Euro filter (cursor smoothing)
    // =========================
    class OneEuroFilter {
      constructor(freq = 60, minCutoff = 1.2, beta = 0.05, dCutoff = 1.0) {
        this.freq = freq;
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;

        this.xPrev = null;
        this.dxPrev = 0;
        this.tPrev = null;
      }

      alpha(cutoff) {
        const te = 1.0 / this.freq;
        const tau = 1.0 / (2 * Math.PI * cutoff);
        return 1.0 / (1.0 + tau / te);
      }

      lowpass(prev, curr, a) {
        return prev + a * (curr - prev);
      }

      filter(x, tMs) {
        if (this.tPrev == null) {
          this.tPrev = tMs;
          this.xPrev = x;
          this.dxPrev = 0;
          return x;
        }

        const dt = Math.max(1e-6, (tMs - this.tPrev) / 1000);
        this.freq = 1.0 / dt;

        const dx = (x - this.xPrev) / dt;
        const ad = this.alpha(this.dCutoff);
        const dxHat = this.lowpass(this.dxPrev, dx, ad);

        const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
        const a = this.alpha(cutoff);

        const xHat = this.lowpass(this.xPrev, x, a);

        this.tPrev = tMs;
        this.xPrev = xHat;
        this.dxPrev = dxHat;

        return xHat;
      }

      reset() {
        this.xPrev = null;
        this.dxPrev = 0;
        this.tPrev = null;
      }
    }

    const xFilter = new OneEuroFilter(60, 1.2, 0.05, 1.0);
    const yFilter = new OneEuroFilter(60, 1.2, 0.05, 1.0);

    // =========================
    // 2) Pinch debounce + hysteresis
    // =========================
    let pinchClosed = false;
    let pinchOnCount = 0;
    let pinchOffCount = 0;

    const PINCH_ON = 0.30;   // tighter pinch to turn ON
    const PINCH_OFF = 0.60;  // wider open to turn OFF
    const ON_FRAMES = 2;     // require N consecutive frames to grab
    const OFF_FRAMES = 3;    // require N consecutive frames to release

    function log(msg) {
      const ts = new Date().toISOString().split("T")[1].split(".")[0];
      logTextarea.value = `[${ts}] ${msg}\n` + logTextarea.value;
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
      log(msg);
    }

    async function initHandLandmarker() {
      setStatus("Loading MediaPipe models…");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task"
        },
        numHands: 1,
        runningMode: "VIDEO"
      });
      setStatus("Models loaded. Click 'Start Camera'.");
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        video.srcObject = stream;

        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        resizeOverlay();
        window.addEventListener("resize", resizeOverlay);

        running = true;
        setStatus("Camera started. Show your hand in front of the camera.");
        log("Ready – pinch over a file to drag it.");

        window.requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        setStatus("Error starting camera: " + err.message);
        log("Error: " + err.message);
      }
    }

    function resizeOverlay() {
      const rect = desktop.getBoundingClientRect();
      overlay.width = rect.width;
      overlay.height = rect.height;
    }

    // Mirror X so hand movement feels natural left/right
    function screenCoordsFromLandmark(landmark) {
      const rect = desktop.getBoundingClientRect();
      const mirroredX = 1 - landmark.x;
      const x = mirroredX * rect.width + rect.left;
      const y = landmark.y * rect.height + rect.top;
      return { x, y };
    }

    function getFileUnderPoint(x, y) {
      for (let i = files.length - 1; i >= 0; i--) {
        const file = files[i];
        const rect = file.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return file;
        }
      }
      return null;
    }

    function updateFilePosition(file, x, y) {
      const desktopRect = desktop.getBoundingClientRect();
      const fileRect = file.getBoundingClientRect();
      const offsetX = fileRect.width / 2;
      const offsetY = fileRect.height / 2;

      let newLeft = x - desktopRect.left - offsetX;
      let newTop = y - desktopRect.top - offsetY;

      newLeft = Math.max(0, Math.min(newLeft, desktopRect.width - fileRect.width));
      newTop = Math.max(0, Math.min(newTop, desktopRect.height - fileRect.height));

      file.style.left = newLeft + "px";
      file.style.top = newTop + "px";
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    // rough hand size: wrist ↔ index MCP
    function getHandScale(landmarks) {
      const wrist = landmarks[0];
      const indexMcp = landmarks[5];
      const d = distance(wrist, indexMcp);
      return d > 0 ? d : 0.0001;
    }

    // Debounced hysteresis pinch state
    function updatePinchStateDebounced(landmarks) {
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];

      const rawDist = distance(thumbTip, indexTip);
      const handScale = getHandScale(landmarks);
      const normDist = rawDist / handScale;

      if (!pinchClosed) {
        if (normDist < PINCH_ON) pinchOnCount++;
        else pinchOnCount = 0;

        if (pinchOnCount >= ON_FRAMES) {
          pinchClosed = true;
          pinchOnCount = 0;
          pinchOffCount = 0;
          log(`Pinch ON (normDist=${normDist.toFixed(2)})`);
        }
      } else {
        if (normDist > PINCH_OFF) pinchOffCount++;
        else pinchOffCount = 0;

        if (pinchOffCount >= OFF_FRAMES) {
          pinchClosed = false;
          pinchOffCount = 0;
          pinchOnCount = 0;
          log(`Pinch OFF (normDist=${normDist.toFixed(2)})`);
        }
      }

      return pinchClosed;
    }

    function drawLandmarks(results) {
      overlayCtx.save();
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      if (!results || !results.landmarks || results.landmarks.length === 0) {
        overlayCtx.restore();
        return;
      }

      const h = results.landmarks[0];

      // mirror landmarks for drawing so overlay matches real movement
      const mirrored = h.map((p) => ({ ...p, x: 1 - p.x }));

      drawingUtils.drawConnectors(mirrored, HandLandmarker.HAND_CONNECTIONS);
      drawingUtils.drawLandmarks(mirrored, { radius: 3 });

      overlayCtx.restore();
    }

    async function loop() {
      if (!running || !handLandmarker) return;

      const videoTime = video.currentTime;
      if (videoTime === lastVideoTime) {
        window.requestAnimationFrame(loop);
        return;
      }
      lastVideoTime = videoTime;

      const nowMs = performance.now();
      const results = handLandmarker.detectForVideo(video, nowMs);

      drawLandmarks(results);

      if (results && results.landmarks && results.landmarks.length > 0) {
        const landmarks = results.landmarks[0];

        const pinchNow = updatePinchStateDebounced(landmarks);

        // cursor = index fingertip (same as before), but smoothed with OneEuro
        const cursorNorm = landmarks[8];
        let { x, y } = screenCoordsFromLandmark(cursorNorm);

        x = xFilter.filter(x, nowMs);
        y = yFilter.filter(y, nowMs);

        isPinching = pinchNow;

        if (isPinching && !wasPinching) {
          const file = getFileUnderPoint(x, y);
          if (file) {
            activeFile = file;
            activeFile.classList.add("active");
            log("Pinch start on " + activeFile.dataset.id);
          } else {
            activeFile = null;
          }
        }

        if (isPinching && activeFile) {
          updateFilePosition(activeFile, x, y);
        }

        if (!isPinching && wasPinching && activeFile) {
          log("Pinch released – dropped " + activeFile.dataset.id);
          activeFile.classList.remove("active");
          activeFile = null;
        }

        wasPinching = isPinching;
      } else {
        // Hand lost: drop and reset filters/states for stability on reacquire
        isPinching = false;

        if (wasPinching && activeFile) {
          log("Hand lost – dropping " + activeFile.dataset.id);
          activeFile.classList.remove("active");
          activeFile = null;
        }

        wasPinching = false;

        pinchClosed = false;
        pinchOnCount = 0;
        pinchOffCount = 0;

        xFilter.reset();
        yFilter.reset();
      }

      window.requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", () => {
      if (!handLandmarker) {
        setStatus("Still loading models – please wait a moment…");
        return;
      }
      if (!running) startCamera();
    });

    if (!("mediaDevices" in navigator && "getUserMedia" in navigator.mediaDevices)) {
      setStatus("getUserMedia not supported in this browser.");
    } else {
      initHandLandmarker().catch((err) => {
        console.error(err);
        setStatus("Failed to init MediaPipe: " + err.message);
      });
    }
  </script>
</body>
</html>
